<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Farid Ben Miles — Acoustic Guitar & Musical Traveler</title>
	<meta name="description" content="Acoustic guitar, compositions & covers by Farid Ben Miles. Listen, watch, follow, book or support the music.">

	<meta name="theme-color" content="#8f0000">

	<!-- Open Graph / link previews -->
	<meta property="og:title" content="Farid Ben Miles — Acoustic Guitar & Musical Traveler">
	<meta property="og:description" content="Acoustic guitar · Musical Traveler · Compositions & Covers">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://faridbenmiles.com/connect">
	<meta property="og:image" content="https://faridbenmiles.com/img/background/Farid-Ben-Miles-mobile.jpg">
	<meta property="og:image:alt" content="Farid Ben Miles playing acoustic guitar">
	<style>
	  :root {
		--bg: #121212;
		--card: #1e1e1e;
		--text: #f5f5f5;
		--accent: #DBD7D2; 
		--accent-hover: #e8c65a;
	  }

	  * { box-sizing: border-box; }

		body {
		position: relative;
		margin: 0;
		min-height: 100vh;
		color: var(--text);
		font-family: Lora, sans-serif;
		display: flex;
		flex-direction: column;
		align-items: center;
		padding: 48px 20px 32px;
		overflow-x: hidden;
	  }

	  body::before {
		content: "";
		position: fixed;
		inset: 0;
		background-image: url('img_epk/faridbenmiles-connected.jpg');
		background-size: cover;
		background-position: center;
		background-repeat: no-repeat;
		z-index: -2;
	  }

	  body::after {
		content: "";
		position: fixed;
		inset: 0;
		background-color: rgba(92, 20, 23, 0.80); /* rouge transparent, ajuste l'alpha (0.55) */
		z-index: -1;
	  }

	  .avatar {
		width: 110px;
		object-fit: cover;
		margin-bottom: 18px;
	  }

	  h1 {
		font-size: 2.5rem;
		margin: 0 0 4px;
		letter-spacing: 0.5px;
		text-align: center;
	  }

	  p.tagline {
		color: #b8b8b8;
		font-size: 1.2rem;
		margin: 0 0 32px;
		text-align: center;
		font-style: italic;
	  }

	  .links {
		width: 100%;
		max-width: 380px;
		display: flex;
		flex-direction: column;
		gap: 14px;
	  }

	  .link-btn {
		display: flex;
		align-items: center;
		//justify-content: center;
		gap: 10px;
		background: var(--card);
		border: 1px solid #333;
		color: var(--text);
		text-decoration: none;
		padding: 15px 20px;
		border-radius: 12px;
		font-size: 0.9rem;
		transition: all 0.2s ease;
	  }

	  .link-btn:hover, .link-btn:active {
		border-color: var(--accent);
		background: #262626;
		transform: translateY(-2px);
	  }

	  .link-btn.donate {
		border-color: var(--accent);
		color: var(--accent);
		font-weight: bold;
	  }

	  .link-btn.donate:hover {
		background: var(--accent);
		color: #121212;
	  }
	  
	  .artist-link {
		text-decoration: none;
		color: inherit;
		display: inline-block;
	  }

	  .artist-link:hover h1,
	  .artist-link:active h1 {
		color: var(--accent); /* petit effet doré au survol/tap, optionnel */
	  }

	  .icon {
		font-size: 1.2rem;
	  }

	  footer {
		margin-top: 40px;
		font-size: 0.75rem;
		color: #DBD7D2;
		text-align: center;
	  }

	  footer a { color: #888; }
	</style>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <img class="avatar" src="img_epk/fbm-white-logo.png" alt="Logo - Farid Ben Miles">

  <h1><a class="artist-link" href="https://faridbenmiles.com" target="_blank" rel="noopener">
     Farid Ben Miles</a></h1>
  <p class="tagline">Acoustic Guitar - Musical Traveler - Compositions & Covers</p>

  <div class="links">
    <a class="link-btn donate" href="https://paypal.me/faridbenmiles" target="_blank" rel="noopener">
      <i class="fa-brands fa-paypal icon"></i> Tip via PayPal
    </a>
	<a class="link-btn" href="https://busk.co/120140/tip" target="_blank" rel="noopener">
      <i class="fa-solid fa-hand-holding-heart icon"></i> Tip via Card - Apple Pay - Google Pay
    </a>
    <a class="link-btn" href="https://faridbenmiles.bandcamp.com/album/going-overseas" target="_blank" rel="noopener">
      <i class="fa-solid fa-compact-disc icon"></i> Listen to my Album
    </a>
	<a class="link-btn" href="mailto:faridbenmiles@gmail.com" rel="noopener">
      <i class="fa-solid fa-envelope icon"></i> Book Me 
    </a>
	<a class="link-btn" href="https://wa.me/4915225173733?text=Bonjour%2C%20je%20vous%20ai%20vu%20jouer%20dans%20la%20rue%20!" target="_blank" rel="noopener">
      <i class="fa-brands fa-whatsapp icon"></i> Let's Chat
    </a>
    <a class="link-btn" href="https://instagram.com/faridbenmiles" target="_blank" rel="noopener">
      <i class="fa-brands fa-instagram icon"></i> Let's Stay in Touch
    </a>
    <a class="link-btn" href="https://youtube.com/faridbenmiles" target="_blank" rel="noopener">
      <i class="fa-brands fa-youtube icon"></i> Watch my Videos
    </a>
	<a class="link-btn" href="https://faridbenmiles.com" target="_blank" rel="noopener">
      <i class="fa-solid fa-globe icon"></i> My Website
    </a>
  </div>

  <footer>
    Merci d'être passé(e) 🎶
  </footer>

</body>
</html>
